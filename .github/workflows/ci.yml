# Test, vet and build on every push and pull request.
#
# GOOS/GOARCH are set explicitly because the GPIO dependency
# (warthog618/go-gpiocdev via womat/golib/gpio/rpi) only compiles for Linux.
# A bare `go vet ./...` on any other platform fails with `undefined: uapi.*`.
#
# Actions are pinned to a commit SHA, with the release it belongs to in a
# comment; dependabot (.github/dependabot.yml) proposes updates.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The tests run natively on the runner (linux/amd64): arm test binaries could
  # not be executed there. They need no hardware - the DL-Bus chain is fed with
  # generated edges, never with a GPIO line.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with race detector
        run: make test

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The three targets that are actually released.
        include:
          - goarch: arm
            goarm: "6"
          - goarch: arm
            goarm: "7"
          - goarch: arm64
            goarm: ""
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # app/certs/ is gitignored but embedded by app/webservices.go.
      - name: Generate development TLS certificates
        run: make ensure_dev_certs

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The Swagger UI sits behind a build tag, so a plain build never compiles it.
      - name: Build with Swagger UI
        run: go build -tags swagger ./...

      # govulncheck and golangci-lint must be BUILT for the runner but ANALYSE
      # the target architecture. Installing them under the job-level GOOS/GOARCH
      # would produce arm binaries the runner cannot execute ("exec format
      # error"), so the install step clears them - empty values fall back to the
      # host - while the scan steps keep them and so inspect the matrix target.
      - name: Install govulncheck and golangci-lint
        env:
          GOOS: ""
          GOARCH: ""
          GOARM: ""
        # Pinned rather than @latest, so a new release cannot turn CI red without a
        # change here. dependabot does not see go install lines - raise them by
        # hand, together with the versions in the Makefile's lint target.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      # The default linters with the exclusions in .golangci.yml.
      - name: golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run ./...

      # Exits non-zero when this code actually calls a vulnerable symbol.
      # Advisories that only sit in required modules are reported but do not
      # fail the build, which keeps the signal on what is reachable from here.
      - name: Vulnerability scan
        run: $(go env GOPATH)/bin/govulncheck ./...
