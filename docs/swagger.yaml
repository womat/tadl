definitions:
  collector.DataloggerStatus:
    properties:
      current:
        type: boolean
      lastFrame:
        type: string
      lastFrameAgeSeconds:
        type: number
      outputs:
        items:
          $ref: '#/definitions/collector.OutputStatus'
        type: array
      temperatures:
        items:
          $ref: '#/definitions/collector.TemperatureStatus'
        type: array
      type:
        type: string
    type: object
  collector.OutputStatus:
    properties:
      key:
        type: string
      label:
        type: string
      "on":
        type: boolean
    type: object
  collector.TemperatureStatus:
    properties:
      key:
        type: string
      label:
        type: string
      max:
        type: number
      min:
        type: number
      trend15m:
        description: |-
          Trend15m is the change in Kelvin over the last 15 minutes; null until
          tadl has run that long or while the sensor is out of range.
        type: number
      value:
        description: 'null: sensor out of range'
        type: number
    type: object
  health.BusStatus:
    properties:
      bitRateHz:
        description: recovered bit clock; null while the decoder searches for it
        type: number
      decoder:
        description: decoder state as text, for troubleshooting
        type: string
      droppedEdges:
        type: integer
      droppedFrames:
        type: integer
      errors24h:
        $ref: '#/definitions/health.ErrorSummary'
      framesReceived:
        description: Cumulative counters since start.
        type: integer
      invertedLine:
        type: boolean
      lastError:
        description: last error within the last 24 h; null if none
        type: string
      lastErrorAgeSeconds:
        type: number
      protocolErrors:
        type: integer
      rejectedFrames:
        type: integer
      signal:
        type: string
    type: object
  health.ErrorSummary:
    properties:
      droppedEdges:
        description: GPIO edges lost before decoding
        type: integer
      droppedFrames:
        description: frames discarded because the reader was busy
        type: integer
      protocolErrors:
        description: frames discarded for a missing stop bit
        type: integer
      rejectedFrames:
        description: frames of the wrong size or device, or without a valid temperature
        type: integer
      total:
        type: integer
    type: object
  health.Model:
    properties:
      app:
        description: Application name (MODULE)
        type: string
      appVersion:
        description: Current version of the application
        type: string
      bus:
        allOf:
        - $ref: '#/definitions/health.BusStatus'
        description: state of the DL-Bus input
      datalogger:
        allOf:
        - $ref: '#/definitions/collector.DataloggerStatus'
        description: latest values of the controller
      goVersion:
        description: Go runtime version
        type: string
      heapAllocBytes:
        description: Allocated heap memory in bytes
        type: integer
      hostname:
        description: Machine name where the app runs
        type: string
      mqtt:
        description: connected | disconnected | disabled
        type: string
      mqttBroker:
        description: broker host:port, never user or password; absent without MQTT
        type: string
      mqttTopic:
        description: topic the values are published to; absent without MQTT
        type: string
      numGoroutines:
        description: Current number of active goroutines
        type: integer
      os:
        description: Operating system name
        type: string
      sysMemoryBytes:
        description: Total memory obtained from the OS
        type: integer
      timestamp:
        description: UTC timestamp when health info was collected (RFC3339)
        type: string
      uptimeSeconds:
        description: Application uptime in seconds
        type: number
    type: object
info:
  contact: {}
paths:
  /data:
    get:
      description: |-
        Returns the latest available values read from the configured data logger.
        The response structure depends on the configured device type:
        UVR42 returns temperature1–4, out1, out2 and a timestamp.
        UVR31 returns temperature1–3, out1 and a timestamp.
        A temperature outside the sensor range is left out.
      produces:
      - application/json
      responses:
        "200":
          description: Current data logger values
          schema:
            properties:
              out1:
                type: boolean
              out2:
                type: boolean
              temperature1:
                type: number
              temperature2:
                type: number
              temperature3:
                type: number
              temperature4:
                type: number
              timestamp:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "503":
          description: No frame received yet, or the last one is stale
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get current data logger values
      tags:
      - data
  /health:
    get:
      description: |-
        Retrieves memory usage, goroutine count, version, hostname, Go runtime version and OS, the MQTT connection state
        with broker (host:port, never credentials) and topic,
        the latest controller values with their names, bar ranges and 15 min trend, and the state of the DL-Bus input
        (signal, bit rate, line polarity, error counters since start and for the last 24 h). The web UI at / reads it.
      produces:
      - application/json
      responses:
        "200":
          description: Health data successfully retrieved
          schema:
            $ref: '#/definitions/health.Model'
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get health data
      tags:
      - info
  /version:
    get:
      description: Returns the current application name and version. No authentication
        required.
      produces:
      - application/json
      responses:
        "200":
          description: Application version and name
          schema:
            properties:
              app:
                type: string
              appVersion:
                type: string
            type: object
      summary: Get application version and name
      tags:
      - info
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
